<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kavi Mart</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f8f5ff;
        }

        header {
            background-color: #6c35a8;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: #4b2478;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        .search {
            text-align: center;
            padding: 25px;
        }

        .search input {
            padding: 12px;
            width: 60%;
            max-width: 400px;
        }

        .products {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }

        .product {
            background: white;
            width: 220px;
            padding: 20px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 2px 8px #ddd;
        }

        .product button {
            background: #6c35a8;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        footer {
            background: #4b2478;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to Kavi Mart-Week 1</h1>
        <p>Your online shopping destination</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#products">Products</a>
        <a href="#contact">Contact</a>
    </nav>

    <div class="search">
        <input type="text" placeholder="Search your products...">
    </div>

    <h2 style="text-align:center;">Our Products</h2>

    <section class="products" id="products">

        <div class="product">
            <h3>Headphones</h3>
            <p>Price: ₹499</p>
            <button onclick="addToCart('Headphones')">
                Add to Cart
            </button>
        </div>

        <div class="product">
            <h3>Watch</h3>
            <p>Price: ₹799</p>
            <button onclick="addToCart('Watch')">
                Add to Cart
            </button>
        </div>

        <div class="product">
            <h3>Handbag</h3>
            <p>Price: ₹599</p>
            <button onclick="addToCart('Handbag')">
                Add to Cart
            </button>
        </div>

    </section>

    <h3 id="cart" style="text-align:center;">
        Cart: 0 items
    </h3>

    <footer id="contact">
        <p>© 2026 Kavi Mart | All Rights Reserved</p>
    </footer>

    <script>
        let cartCount = 0;

        function addToCart(productName) {
            cartCount++;

            document.getElementById("cart").innerText =
                "Cart: " + cartCount + " items";

            alert(productName + " added to cart!");
        }
    </script>

</body>
</html>
